<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🎵 Las Vocales de Bebé 🎵</title>

<!-- PWA: instalable con ícono en el celular -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ff9a9e">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vocales">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Nunito', 'Segoe UI', Arial, sans-serif;
  min-height: 100vh;
  background: linear-gradient(45deg, #ff9a9e, #fad0c4, #ffecd2, #a1c4fd, #d4fc79);
  background-size: 400% 400%;
  animation: gradShift 12s ease infinite;
  overflow-x: hidden;
}

@keyframes gradShift {
  0%   { background-position: 0%   50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0%   50%; }
}

/* ── HEADER ── */
.header {
  text-align: center;
  padding: 18px 80px 8px;
}
.title {
  font-size: clamp(1.8rem, 5vw, 3rem);
  color: white;
  text-shadow: 3px 3px 0 rgba(0,0,0,.18), 0 0 30px rgba(255,255,255,.5);
  display: inline-block;
}

/* ── MUSIC BUTTON ── */
.music-btn {
  position: fixed; bottom:14px; right:14px;
  width:60px; height:60px; border-radius:50%;
  border:4px solid white;
  background:rgba(255,255,255,.92);
  font-size:1.8rem; cursor:pointer; z-index:1000;
  box-shadow:0 4px 20px rgba(0,0,0,.2);
  display:flex; align-items:center; justify-content:center;
  transition:transform .15s;
  -webkit-tap-highlight-color:transparent;
}
.music-btn:active { transform:scale(.88); }
.music-btn.playing { animation: spinBtn 4s linear infinite; }
@keyframes spinBtn { to { transform:rotate(360deg); } }

/* ── VOWEL CARDS ── */
.vowels-wrap {
  display:flex; flex-wrap:wrap;
  justify-content:center; align-items:center; align-content:center;
  gap:clamp(14px,3vw,28px);
  padding:clamp(14px,3vw,28px);
  min-height:calc(100vh - 100px);
}

.vowel-card {
  position:relative;
  width: clamp(130px,24vw,180px);
  height:clamp(150px,27vw,200px);
  border-radius:32px;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  cursor:pointer; user-select:none;
  -webkit-tap-highlight-color:transparent;
  box-shadow:0 8px 28px rgba(0,0,0,.22), 0 0 0 5px rgba(255,255,255,.28);
  transition:transform .12s, box-shadow .12s;
  overflow:hidden;
}
.vowel-card:active { transform:scale(.88) !important; box-shadow:0 3px 12px rgba(0,0,0,.22); }
@keyframes tapFlash {
  0%   { transform:scale(1.1);  filter:brightness(1.5); }
  100% { transform:scale(1);    filter:brightness(1); }
}
.vowel-card.tapped { animation:tapFlash .35s ease-out; }

.v-upper { font-size:clamp(3.8rem,10vw,6rem); font-weight:900; color:white; text-shadow:3px 3px 0 rgba(0,0,0,.15); line-height:1; }
.v-lower { font-size:clamp(2.4rem,6vw,3.5rem); font-weight:700; color:rgba(255,255,255,.82); line-height:1; }

.va { background:linear-gradient(135deg,#ff6b6b,#ee5a24); }
.ve { background:linear-gradient(135deg,#26de81,#20bf6b); }
.vi { background:linear-gradient(135deg,#4fc3f7,#0277bd); }
.vo { background:linear-gradient(135deg,#fd9644,#e67e22); }
.vu { background:linear-gradient(135deg,#b39ddb,#6c5ce7); }

.vowel-card::after {
  content:'✨'; position:absolute; top:8px; right:10px; font-size:1.1rem;
  animation:twinkleCard 2s ease-in-out infinite;
}
@keyframes twinkleCard {
  0%,100%{opacity:.5;transform:scale(.8) rotate(0deg)}
  50%    {opacity:1; transform:scale(1.3) rotate(20deg)}
}

/* Ripple */
.ripple {
  position:absolute; border-radius:50%;
  background:rgba(255,255,255,.38);
  pointer-events:none;
  animation:rippleGrow .6s ease-out forwards;
}
@keyframes rippleGrow {
  from{transform:scale(0);opacity:1}
  to  {transform:scale(5);opacity:0}
}

/* ── MODAL ── */
.modal-overlay {
  position:fixed; inset:0;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(6px);
  z-index:500;
  display:flex; align-items:center; justify-content:center;
  padding:14px;
  opacity:0; pointer-events:none;
  transition:opacity .3s;
}
.modal-overlay.open { opacity:1; pointer-events:all; }

.modal-box {
  background:#fff; border-radius:36px;
  padding:26px 18px 30px;
  width:100%; max-width:480px;
  overflow:hidden; position:relative;
  transform:scale(.65) translateY(60px);
  transition:transform .42s cubic-bezier(.175,.885,.32,1.275);
  box-shadow:0 24px 70px rgba(0,0,0,.32);
}
.modal-overlay.open .modal-box { transform:scale(1) translateY(0); }

.modal-vowel-display {
  text-align:center; font-size:clamp(3.5rem,12vw,5.5rem);
  font-weight:900; line-height:1; margin-bottom:4px;
  cursor:pointer; user-select:none;
  -webkit-tap-highlight-color:transparent;
  transition:transform .12s;
}
.modal-vowel-display:active { transform:scale(.92); }
.modal-subtitle {
  text-align:center; font-size:1rem; color:#777; margin-bottom:18px;
}
.modal-close {
  position:absolute; top:12px; right:12px;
  width:38px; height:38px; border-radius:50%; border:none;
  background:#ff6b6b; color:white;
  font-size:1.1rem; font-weight:bold; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:transform .15s;
}
.modal-close:active { transform:scale(.82); }

/* ── ANIMALS ── */
.animals-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}
.animal-item {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:18px 8px; border-radius:26px;
  background:#f8f9fa; cursor:pointer; user-select:none;
  -webkit-tap-highlight-color:transparent;
  border:3px solid transparent;
  transition:background .25s, border-color .25s, transform .15s;
}
.animal-item:active { transform:scale(.86); }

.animal-emoji {
  font-size:clamp(4.5rem,14vw,5.5rem);
  display:block; line-height:1;
}
.animal-name {
  font-size:1.1rem; font-weight:700; color:#333;
  margin-top:10px; text-align:center; line-height:1.2;
}

/* Animal animations */
.af  { animation:af  2.8s ease-in-out infinite; }
.ab  { animation:ab  1.0s ease-in-out infinite; }
.as2 { animation:as2 1.8s ease-in-out infinite; }
.aw  { animation:aw  1.4s ease-in-out infinite; }
.ap  { animation:ap  2.2s ease-in-out infinite; }
.asp { animation:asp 2.5s ease-in-out infinite; }

@keyframes af  { 0%,100%{transform:translateY(0)}    50%{transform:translateY(-13px)} }
@keyframes ab  { 0%,100%{transform:scaleY(1) translateY(0)} 40%{transform:scaleY(1.18) translateY(-11px)} 60%{transform:scaleY(.88) translateY(0)} }
@keyframes as2 { 0%,100%{transform:rotate(0)}         25%{transform:rotate(-9deg)} 75%{transform:rotate(9deg)} }
@keyframes aw  { 0%,100%{transform:rotate(-12deg)}    50%{transform:rotate(12deg)} }
@keyframes ap  { 0%,100%{transform:scale(1)}           50%{transform:scale(1.22)} }
@keyframes asp { 0%{transform:rotate(0)}               100%{transform:rotate(360deg)} }

/* ── CONFETTI ── */
.cp {
  position:fixed; pointer-events:none; z-index:9999;
  border-radius:3px;
  animation:cpFall linear forwards;
}
@keyframes cpFall {
  0%  { opacity:1; }
  100%{ transform:translateY(110vh) rotate(720deg); opacity:0; }
}

/* ── BG STARS ── */
.bg-star {
  position:fixed; border-radius:50%;
  background:rgba(255,255,255,.7);
  pointer-events:none;
  animation:starRise linear infinite;
}
@keyframes starRise {
  0%  { transform:translateY(105vh); opacity:0; }
  10% { opacity:.7; }
  90% { opacity:.7; }
  100%{ transform:translateY(-10vh) rotate(360deg); opacity:0; }
}
</style>
</head>
<body>

<div id="bgStars"></div>

<button class="music-btn" id="musicBtn" title="Música">🎵</button>

<div class="header">
  <span class="title">🎶 ¡Las Vocales! 🎶</span>
</div>

<div class="vowels-wrap">
  <div class="vowel-card va" data-vowel="A"><span class="v-upper">A</span><span class="v-lower">a</span></div>
  <div class="vowel-card ve" data-vowel="E"><span class="v-upper">E</span><span class="v-lower">e</span></div>
  <div class="vowel-card vi" data-vowel="I"><span class="v-upper">I</span><span class="v-lower">i</span></div>
  <div class="vowel-card vo" data-vowel="O"><span class="v-upper">O</span><span class="v-lower">o</span></div>
  <div class="vowel-card vu" data-vowel="U"><span class="v-upper">U</span><span class="v-lower">u</span></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-vowel-display" id="modalVowel"></div>
    <div class="modal-subtitle">¡Toca cada uno para escuchar su nombre!</div>
    <div class="animals-grid" id="animalsGrid"></div>
  </div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────
const DATA = {
  A:{
    color:'#ff6b6b',
    items:[
      {e:'🐝',n:'Abeja',   a:'as2'},
      {e:'💧',n:'Agua',    a:'af'},
      {e:'🌳',n:'Árbol',   a:'aw'},
      {e:'🦅',n:'Águila',  a:'af'},
    ]
  },
  E:{
    color:'#26de81',
    items:[
      {e:'🐘',n:'Elefante', a:'ab'},
      {e:'⭐',n:'Estrella', a:'ap'},
      {e:'🦔',n:'Erizo',    a:'aw'},
      {e:'🪞',n:'Espejo',   a:'ap'},
    ]
  },
  I:{
    color:'#4fc3f7',
    items:[
      {e:'🦎',n:'Iguana',  a:'aw'},
      {e:'🏝️',n:'Isla',   a:'af'},
      {e:'⛪',n:'Iglesia', a:'ap'},
      {e:'🪶',n:'Indio',   a:'aw'},
    ]
  },
  O:{
    color:'#fd9644',
    items:[
      {e:'🐻',n:'Oso',   a:'ab'},
      {e:'🐑',n:'Oveja',   a:'aw'},
      {e:'👁️',n:'Ojo',  a:'ap'},
      {e:'👂',n:'Oreja', a:'as2'},
    ]
  },
  U:{
    color:'#9575cd',
    items:[
      {e:'🍇',n:'Uva',      a:'ab'},
      {e:'💅',n:'Uña',      a:'ap'},
      {e:'1️⃣',n:'Uno',      a:'ap'},
      {e:'👔',n:'Uniforme', a:'ap'},
    ]
  }
};

// ── SPEECH ────────────────────────────────────────────
const synth = window.speechSynthesis;
let bestVoice = null;

function pickBestVoice() {
  const voices = synth.getVoices();
  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  const es = voices.filter(v => v.lang.startsWith('es'));
  const priority = isIOS
    ? [ v => /paulina/i.test(v.name),
        v => /m[oó]nica/i.test(v.name),
        v => /jorge/i.test(v.name),
        v => true ]
    : [ v => /natural/i.test(v.name),
        v => /online/i.test(v.name),
        v => /google/i.test(v.name),
        v => /microsoft/i.test(v.name),
        v => true ];
  for (const fn of priority) {
    const found = es.find(fn);
    if (found) { bestVoice = found; break; }
  }
}

function speak(text, rate=0.82, pitch=1.0) {
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'es-ES'; u.rate = rate; u.pitch = pitch; u.volume = 1;
  if (bestVoice) u.voice = bestVoice;
  synth.speak(u);
}

synth.getVoices();
window.speechSynthesis.onvoiceschanged = () => pickBestVoice();
pickBestVoice();

// ── CONFETTI ──────────────────────────────────────────
const COLORS = ['#ff6b6b','#ffd43b','#26de81','#4fc3f7','#a29bfe','#ff922b','#f06595','#74c0fc','#63e6be'];

function burst(cx, cy, n=28) {
  for (let i=0; i<n; i++) {
    const el = document.createElement('div');
    el.className = 'cp';
    const size = 7 + Math.random()*9;
    const dx   = (Math.random()-0.5)*220;
    const dur  = .9 + Math.random()*1.1;
    el.style.cssText = `
      left:${cx}px; top:${cy}px;
      width:${size}px; height:${size}px;
      background:${COLORS[Math.floor(Math.random()*COLORS.length)]};
      border-radius:${Math.random()>.5?'50%':'3px'};
      animation-duration:${dur}s;
      animation-delay:${Math.random()*.18}s;
      transform:translate(${dx}px, 0);
    `;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), (dur + .2)*1000);
  }
}

// ── RIPPLE ────────────────────────────────────────────
function ripple(card, e) {
  const r = card.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
  const y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
  const s = Math.max(r.width, r.height);
  const rp = document.createElement('div');
  rp.className = 'ripple';
  rp.style.cssText = `width:${s}px;height:${s}px;left:${x-s/2}px;top:${y-s/2}px`;
  card.appendChild(rp);
  rp.addEventListener('animationend', () => rp.remove());
}

// ── MODAL ────────────────────────────────────────────
const overlay   = document.getElementById('modalOverlay');
const modalVow  = document.getElementById('modalVowel');
const anGrid    = document.getElementById('animalsGrid');
let currentVowel = null;

modalVow.addEventListener('click', () => {
  if (currentVowel) { if (navigator.vibrate) navigator.vibrate(150); playDing(''); setTimeout(() => speak(currentVowel.toLowerCase(), .38, 1.2), 200); }
});

function openModal(vowel, ev) {
  const d = DATA[vowel];
  currentVowel = vowel;

  modalVow.textContent = `${vowel}   ${vowel.toLowerCase()}`;
  modalVow.style.color = d.color;

  anGrid.innerHTML = '';
  d.items.forEach((it, i) => {
    const card = document.createElement('div');
    card.className = 'animal-item';
    card.innerHTML = `
      <span class="animal-emoji ${it.a}" style="animation-delay:${i*.15}s">${it.e}</span>
      <span class="animal-name">${it.n}</span>`;
    card.addEventListener('click', ev2 => {
      if (navigator.vibrate) navigator.vibrate(150);
      speak(it.n, 0.72);
      card.style.background = d.color + '22';
      card.style.borderColor = d.color;
      burst(ev2.clientX, ev2.clientY, 14);
      setTimeout(() => { card.style.background=''; card.style.borderColor='transparent'; }, 900);
    });
    anGrid.appendChild(card);
  });

  overlay.classList.add('open');

  // Play vowel sound: short ding then say the vowel
  playDing(d.color);
  setTimeout(() => speak(vowel.toLowerCase(), .38, 1.2), 280);
}

function closeModal() {
  overlay.classList.remove('open');
  synth.cancel();
}

overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.getElementById('modalClose').addEventListener('click', closeModal);

// Swipe hacia abajo para cerrar el modal
const modalBox = document.querySelector('.modal-box');
let swipeStartY = 0;
modalBox.addEventListener('touchstart', e => {
  swipeStartY = e.touches[0].clientY;
}, {passive: true});
modalBox.addEventListener('touchend', e => {
  const dy = e.changedTouches[0].clientY - swipeStartY;
  if (dy > 80) closeModal();
}, {passive: true});

// ── VOWEL CARDS ───────────────────────────────────────
document.querySelectorAll('.vowel-card').forEach(card => {
  // touchstart: respuesta inmediata sin esperar el click (~300ms más rápido)
  card.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0];
    if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
    card.classList.add('tapped');
    card.addEventListener('animationend', () => card.classList.remove('tapped'), {once:true});
    ripple(card, e);
    burst(t.clientX, t.clientY, 32);
    openModal(card.dataset.vowel, e);
  }, {passive: false});

  // click: fallback para desktop
  card.addEventListener('click', e => {
    if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
    ripple(card, e);
    burst(e.clientX, e.clientY, 32);
    openModal(card.dataset.vowel, e);
  });
});

// ── BACKGROUND MUSIC ─────────────────────────────────
let ctx = null, playing = false, loopTimer = null;

// Canción de las vocales — basada en "Salió la A, no sé a dónde va"
// Melodía infantil tradicional, tono cálido y cantable
const VOCALES_SONG = [
  // "Sa-lió la A, sa-lió la A"
  ['G4',.26],['G4',.26],['A4',.40],['R',.08],
  ['G4',.26],['G4',.26],['A4',.40],['R',.12],
  // "no sé a dón-de va"
  ['B4',.26],['A4',.26],['G4',.26],['A4',.26],['G4',.50],['R',.10],
  // "no sé a dón-de va"
  ['B4',.26],['A4',.26],['G4',.26],['F4',.26],['E4',.56],['R',.22],
  // Eco más alto (segunda estrofa)
  ['C5',.26],['C5',.26],['D5',.40],['R',.08],
  ['C5',.26],['C5',.26],['D5',.40],['R',.12],
  ['E5',.26],['D5',.26],['C5',.26],['D5',.26],['C5',.50],['R',.10],
  ['E5',.26],['D5',.26],['C5',.26],['B4',.26],['C5',.56],['R',.26],
  // Coro: A - E - I - O - U  (subiendo)
  ['C5',.28],['D5',.28],['E5',.28],['F5',.28],['G5',.28],['A5',.58],['R',.16],
  // Coro: U - O - I - E - A  (bajando, cierre)
  ['A5',.28],['G5',.28],['F5',.28],['E5',.28],['D5',.28],['C5',.80],['R',.60],
];

const FREQ = {
  C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,B4:493.88,
  C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880,B5:987.77,
};

function playNote(freq, t, dur) {
  const osc  = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(0.20, t + 0.04);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur * 0.9);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t); osc.stop(t + dur);
}

function scheduleTune() {
  if (!playing || !ctx) return;
  let t = ctx.currentTime + .04;
  VOCALES_SONG.forEach(([n, d]) => {
    if (n !== 'R') playNote(FREQ[n], t, d);
    t += d;
  });
  const total = VOCALES_SONG.reduce((s,[,d])=>s+d,0);
  loopTimer = setTimeout(scheduleTune, (total-.12)*1000);
}

function toggleMusic(e) {
  playing = !playing;
  const btn = document.getElementById('musicBtn');
  if (playing) {
    if (!ctx || ctx.state === 'closed') ctx = new (window.AudioContext||window.webkitAudioContext)();
    btn.textContent='🔊'; btn.classList.add('playing');
    ctx.resume().then(() => scheduleTune());
  } else {
    btn.textContent='🎵'; btn.classList.remove('playing');
    clearTimeout(loopTimer);
    if (ctx) { ctx.close(); ctx = null; }
  }
  burst(e.clientX, e.clientY, 10);
}
document.getElementById('musicBtn').addEventListener('click', toggleMusic);

// ── VOWEL DING ────────────────────────────────────────
function playDing(hexColor) {
  if (!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)();
  if (ctx.state==='suspended') ctx.resume();
  // Quick ascending arpeggio
  [523.25, 659.25, 783.99].forEach((f, i) => {
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    const t = ctx.currentTime + i*.08;
    osc.type='sine'; osc.frequency.value=f;
    gain.gain.setValueAtTime(0,t);
    gain.gain.linearRampToValueAtTime(.22,t+.03);
    gain.gain.linearRampToValueAtTime(0,t+.28);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t); osc.stop(t+.32);
  });
}

// ── SERVICE WORKER (app instalable + offline) ─────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
